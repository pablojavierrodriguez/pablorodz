<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131720" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Mineral Dark Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Emerald Root Slash '/' -->
  <path
    d="M 14 46 L 23 18"
    stroke="url(#slashGrad)"
    stroke-width="6.5"
    stroke-linecap="round"
  />

  <!-- Crisp Geometric 'P' -->
  <path
    d="M 31 46 V 18 H 42 C 47.8 18 51.5 21.3 51.5 26.2 C 51.5 31.1 47.8 34.4 42 34.4 H 31"
    stroke="#f8fafc"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
